name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build APK (Release)
        run: dotnet publish CompletelyRandomSlot.csproj -f net9.0-android -c Release -o artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompletelyRandomSlot-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish to Release v1.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls artifacts/*.apk | head -n 1)
          echo "APK: $APK"
          if gh release view v1.0 > /dev/null 2>&1; then
            gh release upload v1.0 "$APK" --clobber
          else
            gh release create v1.0 "$APK" --title "v1.0" --notes "完全ランダムスロット v1.0（確率操作なしのスロット）"
          fi
